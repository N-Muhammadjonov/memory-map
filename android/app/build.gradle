plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}
android {
    namespace 'com.memorymap.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.memorymap.app'
        minSdk 24
        targetSdk 35
        versionCode 40
        versionName '40.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        release {
            if (System.getenv('MEMORYMAP_ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('MEMORYMAP_ANDROID_KEYSTORE'))
                storePassword System.getenv('MEMORYMAP_ANDROID_PASSWORD')
                keyAlias 'memorymap'
                keyPassword System.getenv('MEMORYMAP_ANDROID_PASSWORD')
                storeType 'PKCS12'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('MEMORYMAP_ANDROID_KEYSTORE')) { signingConfig signingConfigs.release }
        }
    }
}
chaquopy {
    defaultConfig {
        version = "3.12"
        extractPackages("memorymap_runtime")
        pip { install("PyYAML==6.0.3") }
    }
}
dependencies {
    implementation 'org.bouncycastle:bcprov-jdk18on:1.87'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
