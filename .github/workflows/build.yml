name: Build and release Memory map

on:
  workflow_dispatch:
    inputs:
      android_only:
        description: Verify the Android package without repeating desktop builds
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || !inputs.android_only
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, name: MemoryMap-windows-x64, binary: dist/MemoryMap.exe}
          - {os: macos-15, name: MemoryMap-macos-arm64, binary: dist/MemoryMap}
          - {os: macos-15-intel, name: MemoryMap-macos-x64, binary: dist/MemoryMap}
          - {os: ubuntu-22.04, name: MemoryMap-linux-x64, binary: dist/MemoryMap}
          - {os: ubuntu-24.04-arm, name: MemoryMap-linux-arm64, binary: dist/MemoryMap}
    runs-on: ${{ matrix.os }}
    env:
      WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: matrix.name == 'MemoryMap-linux-x64'
        with:
          node-version: "22"
      - name: Install Linux desktop runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libnss3 libgbm1 libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0
      - if: matrix.name != 'MemoryMap-macos-x64'
        run: python -m pip install pyinstaller==6.22.3 -r requirements-desktop.txt
      - name: Build Intel macOS cryptography with static OpenSSL
        if: matrix.name == 'MemoryMap-macos-x64'
        run: |
          export OPENSSL_DIR="$(brew --prefix openssl@3)"
          export OPENSSL_STATIC=1
          test -f "$OPENSSL_DIR/lib/libssl.a"
          test -f "$OPENSSL_DIR/lib/libcrypto.a"
          python -m pip install --no-cache-dir --no-binary cryptography pyinstaller==6.22.3 -r requirements-desktop.txt
          binding=$(python -c 'from cryptography.hazmat.bindings import _rust; print(_rust.__file__)')
          otool -L "$binding"
          if otool -L "$binding" | grep -E 'lib(ssl|crypto)\.[^ ]*dylib'; then
            echo "Intel cryptography must not depend on a conflicting dynamic OpenSSL library."
            exit 1
          fi
      - run: python -m unittest discover -s tests
      - name: Verify actual native desktop window
        if: runner.os != 'Linux' || matrix.name == 'MemoryMap-linux-x64'
        timeout-minutes: 4
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: python tests/native_window_smoke.py
      - if: matrix.name == 'MemoryMap-linux-x64'
        run: node --test --experimental-default-type=module tests/*.mjs stats-worker/worker.test.mjs
      - name: Verify owner dashboard in Chromium
        if: matrix.name == 'MemoryMap-linux-x64'
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
          python tests/browser/owner_v40.py
          python tests/browser/site_v27.py
          python tests/browser/inline_format_v45.py
      - name: Bake public service configuration
        env:
          XOTIRA_STATS_URL: ${{ vars.XOTIRA_STATS_URL }}
          XOTIRA_GITHUB_REPO: ${{ github.repository }}
          XOTIRA_AUTH_URL: ${{ vars.XOTIRA_AUTH_URL }}
          XOTIRA_AUTH_KEY: ${{ vars.XOTIRA_AUTH_KEY }}
          XOTIRA_AUTH_SITE_URL: ${{ vars.XOTIRA_AUTH_SITE_URL }}
        run: python scripts/build_configuration.py
      - name: Prepare macOS Developer ID before bundling embedded binaries
        if: runner.os == 'macOS' && env.APPLE_CERT_BASE64 != ''
        run: |
          test -n "$APPLE_SIGN_IDENTITY"
          test -n "$APPLE_ID"
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_APP_PASSWORD"
          cert="$RUNNER_TEMP/memorymap-signing.p12"
          trap 'rm -f "$cert"' EXIT
          echo "$APPLE_CERT_BASE64" | base64 --decode > "$cert"
          chmod 600 "$cert"
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import "$cert" -k build.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          security find-identity -v -p codesigning build.keychain
      - run: pyinstaller --noconfirm --clean xotira.spec
      - name: Sign (Windows) when publisher certificate is configured
        if: runner.os == 'Windows' && env.WINDOWS_CERT_BASE64 != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          $tool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1).FullName
          & $tool sign /f cert.pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr https://timestamp.digicert.com /td SHA256 dist\MemoryMap.exe
          if ($LASTEXITCODE -ne 0) { throw "Signing failed" }
          Remove-Item cert.pfx
      - name: Sign and notarize (macOS) when publisher certificate is configured
        if: runner.os == 'macOS' && env.APPLE_CERT_BASE64 != ''
        run: |
          codesign --verify --strict --verbose=2 dist/MemoryMap
          ditto -c -k dist/MemoryMap notarize.zip
          trap 'rm -f notarize.zip' EXIT
          xcrun notarytool submit notarize.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait --output-format json > "$RUNNER_TEMP/memorymap-notary.json"
          python -c 'import json,sys; assert json.load(open(sys.argv[1]))["status"] == "Accepted"' "$RUNNER_TEMP/memorymap-notary.json"
      - run: python tests/smoke_binary.py ${{ matrix.binary }}
      - name: Package release assets
        run: python scripts/package_desktop.py "${{ matrix.name }}" "${{ matrix.binary }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*
          if-no-files-found: error
          retention-days: 1

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Bake public service configuration
        env:
          XOTIRA_STATS_URL: ${{ vars.XOTIRA_STATS_URL }}
          XOTIRA_GITHUB_REPO: ${{ github.repository }}
          XOTIRA_AUTH_URL: ${{ vars.XOTIRA_AUTH_URL }}
          XOTIRA_AUTH_KEY: ${{ vars.XOTIRA_AUTH_KEY }}
          XOTIRA_AUTH_SITE_URL: ${{ vars.XOTIRA_AUTH_SITE_URL }}
        run: python scripts/build_configuration.py
      - run: python scripts/prepare_android.py
      - run: gradle -p android :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Android vault on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: >-
            gradle -p android :app:connectedDebugAndroidTest ||
            { adb logcat -d -s python.stderr:V python.stdout:V TestRunner:V; exit 1; }
      - name: Sign Android distributive
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          MEMORYMAP_ANDROID_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_B64"
          test -n "$MEMORYMAP_ANDROID_PASSWORD"
          export MEMORYMAP_ANDROID_KEYSTORE="$RUNNER_TEMP/memorymap.p12"
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > "$MEMORYMAP_ANDROID_KEYSTORE"
          chmod 600 "$MEMORYMAP_ANDROID_KEYSTORE"
          gradle -p android :app:assembleRelease
          rm -f "$MEMORYMAP_ANDROID_KEYSTORE"
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/MemoryMap-android.apk
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        with:
          name: MemoryMap-android
          path: out/MemoryMap-android.apk
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [build, android]
    concurrency:
      group: memory-map-release-draft
      cancel-in-progress: false
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version and protect existing releases
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(sed -n 's/^VERSION = "\(v[0-9][0-9]*\)"$/\1/p' telemetry.py)
          [[ "$tag" =~ ^v[0-9]+$ ]]
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$tag" = "$GITHUB_REF_NAME"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
          if grep -Fxq "$tag" <<< "$existing"; then
            echo "Release $tag already exists; never replace its assets."
            echo "create=false" >> "$GITHUB_OUTPUT"
          else
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.create == 'true'
        with:
          path: out
          merge-multiple: true
      - name: Manifest of exact distributive checksums
        if: steps.version.outputs.create == 'true'
        run: |
          cd out
          expected=(MemoryMap-android.apk MemoryMap-linux-arm64.bin MemoryMap-linux-arm64.tar.gz MemoryMap-linux-x64.bin MemoryMap-linux-x64.tar.gz MemoryMap-macos-arm64.bin MemoryMap-macos-arm64.dmg MemoryMap-macos-x64.bin MemoryMap-macos-x64.dmg MemoryMap-windows-x64.exe)
          for asset in "${expected[@]}"; do test -s "$asset"; done
          shopt -s nullglob
          actual=(MemoryMap-*)
          test "${#actual[@]}" -eq "${#expected[@]}"
          sha256sum "${expected[@]}" > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.create == 'true'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: out/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: true
